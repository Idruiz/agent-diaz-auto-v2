name: Refresh patched production dependencies

on:
  push:
    branches:
      - "cloudflare/worker-native-v2"
    paths:
      - ".github/workflows/refresh-security-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Refresh patched lock entries
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm update --package-lock-only --ignore-scripts adm-zip multer sharp
          node -e "const p=require('./package-lock.json'); for (const n of ['adm-zip','multer','sharp']) console.log(n,p.packages['node_modules/'+n]?.version)"
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh patched production dependency lock"
          git push origin HEAD:cloudflare/worker-native-v2
