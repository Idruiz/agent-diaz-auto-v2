name: Verify

on:
  push:
    branches:
      - main
      - "build/**"
      - "upgrade/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install office render validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress-nogui libreoffice-writer-nogui poppler-utils
      - name: Install locked dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Build containerized exact-prompt regression environment
        run: docker build --target regression --tag jefe-auto-regression:${{ github.sha }} .
      - name: Generate checkpoint-3 golden matrix inside container
        run: |
          rm -rf storage/diagnostics/checkpoint-3
          mkdir -p storage/diagnostics/checkpoint-3
          docker run --rm \
            -e CI=1 \
            -e GITHUB_SHA=${{ github.sha }} \
            -e WRITE_CHECKPOINT_3=1 \
            -v "$PWD/storage/diagnostics/checkpoint-3:/app/storage/diagnostics/checkpoint-3" \
            jefe-auto-regression:${{ github.sha }} \
            npm run checkpoint:3
      - name: Report checkpoint-3 manifest
        run: |
          echo "===== checkpoint-3 files ====="
          find storage/diagnostics/checkpoint-3 -maxdepth 1 -type f -printf '%f\n' | sort
          echo "===== checkpoint-3 sha256 ====="
          sha256sum storage/diagnostics/checkpoint-3/* | sort -k2
          echo "===== checkpoint-3 summary.json ====="
          cat storage/diagnostics/checkpoint-3/summary.json
      - name: Reproduce exact presentation route inside container
        run: |
          docker run --rm \
            -e CI=1 \
            -e GITHUB_SHA=${{ github.sha }} \
            jefe-auto-regression:${{ github.sha }} \
            npx vitest run --root . src/server/__tests__/agent.test.ts \
              -t "completes every artifact route through evidence, structure, build, validation, and persistence"
      - name: Verify Cloudflare sandbox execution plane
        working-directory: cloudflare-sandbox
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run verify:contract
      - name: Build Cloudflare sandbox browser image
        run: docker build --tag jefe-auto-cloudflare-sandbox:${{ github.sha }} cloudflare-sandbox
      - name: Verify Cloudflare sandbox browser image
        run: |
          docker run --rm --entrypoint sh jefe-auto-cloudflare-sandbox:${{ github.sha }} -lc 'set -eu; test -d /workspace; test -w /workspace; chromium --version; playwright-mcp --help >/dev/null; chrome-devtools-mcp --help >/dev/null; mcp-proxy --help >/dev/null; NODE_PATH=/usr/local/lib/node_modules node -e "const p=require(\"puppeteer\"); if (!p.launch) process.exit(1); console.log(\"Cloudflare Puppeteer module smoke passed\")"'
          docker run --rm --entrypoint node -v "$PWD:/checks:ro" jefe-auto-cloudflare-sandbox:${{ github.sha }} /checks/scripts/cloudflare-browser-smoke.mjs
      - name: Build production container
        run: docker build --tag jefe-auto-verify:${{ github.sha }} .
      - name: Verify browser autonomy in production container
        run: |
          docker run --rm --entrypoint chromium jefe-auto-verify:${{ github.sha }} --version
          docker run --rm --entrypoint npx jefe-auto-verify:${{ github.sha }} --no-install @playwright/mcp --help
          docker run --rm --entrypoint npx jefe-auto-verify:${{ github.sha }} --no-install chrome-devtools-mcp --help
          docker run --rm --entrypoint node jefe-auto-verify:${{ github.sha }} --input-type=module -e 'import puppeteer from "puppeteer"; const browser = await puppeteer.launch({executablePath:"/usr/bin/chromium",headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]}); const page = await browser.newPage(); await page.setContent("<title>JEFE AUTO</title>"); if ((await page.title()) !== "JEFE AUTO") process.exit(1); await browser.close(); console.log("Puppeteer browser smoke passed");'
      - name: Preserve exact-prompt regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: french-present-tense-regression
          path: |
            test-results/french-present-tense-regression.pptx
            test-results/agent-runner-french-present-tense-regression.pptx
          if-no-files-found: error
          retention-days: 7
      - name: Preserve checkpoint-3 artifact package
        uses: actions/upload-artifact@v4
        with:
          name: jefe-auto-checkpoint-3
          path: storage/diagnostics/checkpoint-3/**
          if-no-files-found: error
          retention-days: 14
