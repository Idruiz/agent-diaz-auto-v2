name: Apply JEFE AUTO Build Compatibility Fix

on:
  push:
    branches:
      - build/jefe-auto-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply JEFE AUTO build compatibility fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/jefe-auto-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Apply narrow compatibility repair
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('src/web/styles.css', 'src/web/chat.css'):
              p = Path(name)
              text = p.read_text()
              if '\\n' not in text:
                  raise SystemExit(f'expected literal backslash-n sequences in {name}')
              p.write_text(text.replace('\\n', '\n'))
          p = Path('scripts/runtime-smoke.mjs')
          text = p.read_text()
          old = 'versionBody.packageVersion !== "3.4.0"'
          new = 'versionBody.packageVersion !== "4.0.0"'
          if old not in text:
              raise SystemExit('runtime smoke package-version anchor missing')
          p.write_text(text.replace(old, new, 1))
          Path('verify-failure.txt').unlink(missing_ok=True)
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Verify CSS build and runtime smoke
        run: |
          npm run check
          npm run build
          npm run smoke
      - name: Commit permanent repair
        run: |
          git config user.name 'JEFE AUTO Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/web/styles.css src/web/chat.css scripts/runtime-smoke.mjs
          git rm -f --ignore-unmatch verify-failure.txt
          git commit -m 'Fix JEFE AUTO light-theme build and runtime smoke'
          git push origin HEAD:build/jefe-auto-v2
