name: Upgrade Cloudflare real filesystem

on:
  push:
    branches:
      - upgrade/cloudflare-real-fs

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Cloudflare real filesystem upgrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/cloudflare-real-fs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Apply architecture upgrade
        run: |
          python3 scripts/apply-cloudflare-real-fs-upgrade.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/v2/artifact-agent-runtime.ts')
          s = p.read_text()
          s = s.replace(
              'let internalDefinitions = [];',
              'let internalDefinitions: import("./mcp-runtime.js").V2InternalMcpDefinition[] = [];',
          )
          p.write_text(s)
          PY
      - name: Install root dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --no-audit --no-fund
      - name: Verify root application
        run: npm run verify
      - name: Lock and verify Cloudflare sandbox worker
        working-directory: cloudflare-sandbox
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run verify:contract
      - name: Build Cloudflare sandbox browser image
        run: docker build --tag jefe-auto-cloudflare-sandbox:test cloudflare-sandbox
      - name: Smoke Cloudflare sandbox browser image
        run: |
          docker run --rm --entrypoint sh jefe-auto-cloudflare-sandbox:test -lc 'set -eu; test -d /workspace; test -w /workspace; chromium --version; playwright-mcp --help >/dev/null; chrome-devtools-mcp --help >/dev/null; mcp-proxy --help >/dev/null; NODE_PATH=/usr/local/lib/node_modules node -e "const p=require(\"puppeteer\"); if (!p.launch) process.exit(1); console.log(\"puppeteer module ok\")"'
      - name: Commit verified upgrade
        run: |
          rm -f scripts/apply-cloudflare-real-fs-upgrade.py
          git config user.name 'JEFE AUTO Upgrade'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset .github/workflows/upgrade-cloudflare-real-fs.yml
          git commit -m 'Run browsers inside Cloudflare persistent workspace'
          git push origin HEAD:upgrade/cloudflare-real-fs
